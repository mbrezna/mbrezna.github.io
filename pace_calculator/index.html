<!DOCTYPE html> 
<html lang="en">
	<head>
		<title>Matěj Března</title>
		<meta charset="UTF-8">
		<meta name="description" content="Personal portfolio. Geoinformatics and Cartography student focusing on WebGIS and tool development.">
		<meta name="author" content="Matěj Března">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pace-calculator.css">
	</head>

	<body>
    <h1>Time and speed calculator</h1>

    <div>
      <p>Pace (min/km) to speed (km/h):</p>
      <p>
        <input class="input-rectangle js-pace-input" placeholder="etc. 4"> min/km
        <button class="js-pace-submit-button">Submit</button>
      </p>
    </div>

    <div>
      <p>Speed (km/h) to pace (min/km):</p>
      <p>
        <input class="input-rectangle js-speed-input" placeholder="etc. 20"> km/h
        <button class="js-speed-submit-button">Submit</button>
      </p>
    </div>

    <script src="pace-calculator.js"></script>
	</body>
</html>
