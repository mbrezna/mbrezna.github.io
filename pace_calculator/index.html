<!DOCTYPE html> 
<html lang="en">
	<head> 
		<title>Matěj Března</title>
		<meta charset="UTF-8">
		<meta name="description" content="Personal portfolio. Geoinformatics and Cartography student focusing on WebGIS and tool development.">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pace-calculator.css">
	</head>

	<body>
    <h1>Pace and speed calculator</h1>

    <div>
      <p>Pace:
        <input class="pace-input-rectangle js-pace-min" type="number" min="0" max="99" placeholder="3">
        <input class="pace-input-rectangle js-pace-sec" type="number" min="0" max="59" placeholder="45"> min/km
      </p>
    </div>

    <div>
      <p>Speed:
        <input class="input-rectangle js-speed-input" type="number" placeholder="16.00"> km/h
      </p>
    </div>

    <script src="pace-calculator.js"></script>
	</body>
</html>
